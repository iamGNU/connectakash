# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Redeploy every 6 hours so the blog's subscriber count stays fresh
  schedule:
    - cron: "17 */6 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Writes subscribers.json for the blog's subscriber count.
      # Needs the KIT_API_KEY repository secret; without it (or if Kit is
      # unreachable) the count is simply hidden and the deploy carries on.
      - name: Fetch blog subscriber count from Kit
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: |
          if [ -z "$KIT_API_KEY" ]; then
            echo "KIT_API_KEY not set; skipping subscriber count."
            exit 0
          fi
          if ! response=$(curl -sf --max-time 30 \
                -H "X-Kit-Api-Key: $KIT_API_KEY" \
                "https://api.kit.com/v4/subscribers?status=active&include_total_count=true&per_page=1"); then
            echo "::warning::Could not reach Kit; skipping subscriber count."
            exit 0
          fi
          count=$(echo "$response" | jq '.pagination.total_count // .total_count // empty')
          if [ -z "$count" ]; then
            echo "::warning::Kit response had no total_count; skipping subscriber count."
            exit 0
          fi
          printf '{"count": %s, "updated": "%s"}\n' "$count" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > subscribers.json
          echo "Subscriber count: $count"
      - name: github-pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
